# Baut die Website neu und veröffentlicht sie auf GitHub Pages. Angestoßen alle 15 Minuten von takt.yml;
# der eigene Zeitplan ist nur Rückfallebene (GitHub verschiebt ihn oft um Stunden).
name: Website aktualisieren

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_NAME: ${{ vars.SITE_NAME }}
      BASE_PATH: ${{ vars.BASE_PATH }}
      APP_STORE_URL: ${{ vars.APP_STORE_URL }}
      APP_ID: ${{ vars.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Letzten Datenstand behalten, falls die API bei einzelnen Abrufen ausfällt
      - uses: actions/cache@v4
        with:
          path: cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-
      - run: python fetch.py
      - run: python build.py
      - name: Eigene Domain eintragen
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
